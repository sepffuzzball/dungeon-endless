services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dungeon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: dungeon
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dungeon -d dungeon']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?set APP_ENCRYPTION_KEY}
      NODE_ENV: ${NODE_ENV:-production}
      SECURE_COOKIE: ${SECURE_COOKIE:-true}
      PORT: '3000'
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      ALLOW_INSECURE_LLM_URLS: ${ALLOW_INSECURE_LLM_URLS:-false}
      ALLOW_PRIVATE_LLM_URLS: ${ALLOW_PRIVATE_LLM_URLS:-false}
      LLM_MAX_TOKENS: '${LLM_MAX_TOKENS:-600}'
      LLM_MAX_RESPONSE_BYTES: '${LLM_MAX_RESPONSE_BYTES:-8192}'
      LLM_TIMEOUT_MS: '${LLM_TIMEOUT_MS:-20000}'
      LLM_DIAGNOSTICS: ${LLM_DIAGNOSTICS:-true}
    ports:
      - '3000:3000'

volumes:
  db_data:
